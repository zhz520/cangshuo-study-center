else if(action==='examnext'){if(examIndex<2){examIndex++;render()}else showExamSubmit()}
else if(action==='exammark'){examMarked.has(examIndex)?examMarked.delete(examIndex):examMarked.add(examIndex);render()}
else if(action==='examsheet'){show('考试答题卡',`<small>● 当前　✓ 已答　○ 未答　⚑ 标记</small><div class="sheet-grid">${questions.map((q,i)=>`<button class="${i===examIndex?'current':(examAnswers[i]||[]).length?'answered':''}" data-action="examjump:${i}">${i+1}${examMarked.has(i)?' ⚑':''}</button>`).join('')}</div><button class="primary wide" data-action="examchecksubmit">检查并交卷</button>`)}
else if(action.startsWith('examjump:')){examIndex=Number(arg);render()}
else if(action==='examchecksubmit')showExamSubmit()
else if(action==='examsubmit'){examSubmitted=true;screen='exam-result';render()}
else if(action==='examwrongonly'){wrongOnly=!wrongOnly;render()}
else if(action==='examquit'){show('退出本次考试？','<p>实际 App 退出会中止本次考试并记为 0 分。预览不会更改真实成绩。</p><button class="wide outline" data-go="exam">退出演示考试</button>')}
else if(action==='examhistory'){show('考试记录','<p>综合模拟一 · 2026-10-20 · 演示成绩 85 分</p><button class="wide outline" data-go="exam-result">查看记录</button>')}
else if(action==='appearance'){show('主题模式','<button class="wide" data-action="setlight">浅色</button><button class="wide" data-action="setdark">深色</button>')}
else if(action==='setlight'||action==='setdark'){document.body.classList.toggle('dark',action==='setdark');document.getElementById('theme').textContent=action==='setdark'?'浅色模式':'深色模式';render()}
else if(action==='accent'){show('重点色','<div class="chipbar">'+[['蓝色','#2563eb'],['靛蓝','#4f46e5'],['青色','#0f766e']].map(([name,color])=>`<button class="outline" data-action="setaccent:${color}">${name}</button>`).join('')+'</div>')}
else if(action.startsWith('setaccent:')){document.body.style.setProperty('--brand',arg);render()}
else if(action==='redeempreview'){show('兑换激活码','<input id="redeem-demo" aria-label="演示激活码" placeholder="激活码"><div class="tinygap"></div><button class="primary wide" data-action="redeemcheckpreview">兑换演示</button>')}
else if(action==='redeemcheckpreview'){show('演示校验','<p>预览不调用兑换接口，不更改账号会员状态。</p>')}
else if(action.startsWith('scheduleday:')){document.getElementById('schedule-day').textContent=arg;document.querySelectorAll('[data-action^="scheduleday:"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action==='scheduleday:'+arg))}
else if(action.endsWith('preview')||action.startsWith('tool:')){const labels={feedbackpreview:'意见反馈',ratingpreview:'应用评分',sharepreview:'分享应用',versionpreview:'版本信息',cachepreview:'清理缓存',aboutpreview:'关于烁学',licensespreview:'开源许可',privacypreview:'隐私政策',logoutpreview:'退出登录',editnamepreview:'编辑昵称',editsignpreview:'编辑签名',passwordpreview:'修改密码',emailpreview:'更换邮箱',qqpreview:'QQ 绑定',commentpreview:'发送评论',contributepreview:'提交投稿',exportpreview:'导出备份',importpreview:'恢复备份',resetpreview:'重置进度'};show(labels[action]||arg||'交互演示','<p>功能已保留在原生 App 中。这里仅展示交互，不访问线上服务、修改账号、发送消息或清空真实数据。</p>')}
else handled=false;
if(handled){event.preventDefault();event.stopImmediatePropagation()}},true);
function showExamSubmit(){let answered=Object.values(examAnswers).filter(a=>a.length).length;show('确认交卷',`<p>已答 ${answered} 题，未答 ${3-answered} 题。提交后无法修改答案。</p><div class="tinygap"></div><button class="primary wide" data-action="examsubmit">确认交卷</button><button class="wide" data-action="examsheet">检查答题卡</button>`)}
document.addEventListener('input',event=>{const input=event.target;if(input.id==='favsearch'||input.id==='resourcesearch'){const value=input.value,pos=input.selectionStart;if(input.id==='favsearch'){favoriteQuery=value;favoriteSelected.clear()}else resourceQuery=value;const id=input.id;render();const current=document.getElementById(id);current.focus();current.setSelectionRange(pos,pos)}if(input.id==='papersearch')document.querySelectorAll('#paper-list section').forEach(el=>el.hidden=!el.textContent.includes(input.value))});
document.addEventListener('change',event=>{if(event.target.dataset.favSelect!==undefined){const id=Number(event.target.dataset.favSelect);event.target.checked?favoriteSelected.add(id):favoriteSelected.delete(id);render()}});
setInterval(()=>{const timer=document.getElementById('exam-timer');if(timer&&screen==='exam-taking'){const remaining=Math.max(0,Math.ceil((examDeadline-Date.now())/1000));timer.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}},1000);
function phase2(){return `<div class="page"><h1>${screen==='resources'?'资源':'我的'}</h1><div class="gap"></div><h3>后续页面</h3><p class="muted">确认四个页面后，沿用相同设计令牌继续展开。</p><div class="gap"></div><button class="outline" data-go="home">返回页面</button></div>${nav(screen)}`}
function render(){if(screen==='practice'&&!app.dataset.view?.startsWith('practice:'))practiceStart=Date.now();const oldScroll=app.querySelector(':scope >.page')?.scrollTop||0;const key=screen+':'+(screen==='practice'?index:screen==='review'?detail:'');const keepScroll=app.dataset.view===key;document.querySelector('.preview-switcher')?.removeAttribute('open');overlay.innerHTML='';app.innerHTML=screen==='home'?home():screen==='bank'?bank():screen==='practice'?practice():screen==='review'?review():expandedPage();app.dataset.view=key;if(keepScroll&&app.querySelector(':scope >.page'))app.querySelector(':scope >.page').scrollTop=oldScroll;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-selected',b.dataset.screen===screen));let n=notes[screen]||(screen.startsWith('exam')?notes.exam:['member','account','publicprofile'].includes(screen)?notes.profile:['article','contribute','tools','links'].includes(screen)?notes.resources:notes.home);document.getElementById('notes').innerHTML=`<div class="index">${n[0]}</div><h2>${n[1]}</h2><p>${n[2]}</p><hr><p>${n[3]}</p><small>预览用于确认设计与交互；数据为演示内容。Android 源码已接入真实接口，预览不访问线上服务。</small>`}
function show(title,content){overlay.innerHTML=`<div class="sheet-cover"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="row between"><h2>${title}</h2><button data-action="close" aria-label="关闭">✕</button></div>${content}</section></div>`;overlay.querySelector('button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen||b.dataset.go){screen=b.dataset.screen||b.dataset.go;reviewMode=false;render();return}const a=b.dataset.action||'',v=a.split(':').slice(1).join(':');if(a==='review'||a==='practice'){screen=a;render();return}if(a==='close'){overlay.innerHTML='';return}if(a==='phase2'){show('后续页面','<p class="muted">该功能保留在 Android 项目中，完整视觉重构将在核心设计确认后展开。</p>');return}if(a==='goal'){show('每日刷题目标',[10,20,30,50,100].map(n=>`<button class="wide" data-action="setgoal:${n}">${n} 题</button>`).join(''));return}if(a.startsWith('setgoal:')){goal=Number(v);render();return}if(a.startsWith('group:'))group=v;else if(a==='pinned')pinnedOnly=!pinnedOnly;else if(a.startsWith('pin:'))pinned.has(+v)?pinned.delete(+v):pinned.add(+v);else if(a.startsWith('answer:')){if(submitted.has(index))return;let q=questions[index];if(q.type==='多选'){let set=new Set(answers[index]||[]);set.has(v)?set.delete(v):set.add(v);answers[index]=[...set]}else {answers[index]=[v];if(instant)submitted.add(index)}}else if(a==='submit'){if(!submitted.has(index))submitted.add(index);else if(index<2)index++;else {show('本次练习结果',`<div class="metrics"><div class="metric"><strong>${[...submitted].filter(i=>JSON.stringify([...(answers[i]||[])].sort())===JSON.stringify(questions[i].answer)).length}</strong><small>答对</small></div><div class="metric"><strong>${submitted.size}</strong><small>已答</small></div></div><button class="wide outline" data-action="sheet">检查答题卡</button>`);return}}else if(a==='prev')index=Math.max(0,index-1);else if(a==='backpractice'){screen=reviewMode?'review':'bank'}else if(a==='sheet'){show('答题卡',`<small>● 当前　✓ 已答　○ 未答　⚑ 标记</small><div class="sheet-grid">${questions.map((q,i)=>`<button class="${i===index?'current':submitted.has(i)?'answered':''}" data-action="jump:${i}">${i+1}${marked.has(i)?' ⚑':''}</button>`).join('')}</div>`);return}else if(a.startsWith('jump:'))index=+v;else if(a==='more'){show('练习操作',`<button class="wide" data-action="feedback">${instant?'改为提交后反馈':'改为即时反馈'}</button><button class="wide" data-action="mark">${marked.has(index)?'取消标记':'标记此题'}</button><button class="wide" data-action="shuffle">随机练习</button><button class="wide" data-action="report">题目纠错</button>`);return}else if(a==='feedback')instant=!instant;else if(a==='mark')marked.has(index)?marked.delete(index):marked.add(index);else if(a==='shuffle')index=(index+1)%3;else if(a==='favq'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');b.style.color=b.getAttribute('aria-pressed')==='true'?'var(--brand)':'var(--muted)';return}else if(a==='report'){show('题目纠错','<label><select aria-label="纠错类型"><option>题目有误</option><option>答案或解析有误</option><option>排版问题</option></select></label><div class="tinygap"></div><input placeholder="补充说明（选填）" aria-label="补充说明"><div class="tinygap"></div><button class="primary wide" data-action="reportdone">提交演示反馈</button>');return}else if(a==='reportdone'){show('反馈已记录','<p>此处为交互演示，不会向线上提交数据。</p>');return}else if(a==='ai'){show('AI 讲解','<p>实际 App 通过原有服务端接口请求讲解；本预览不产生请求或费用。</p>');return}else if(a==='detail')detail=true;else if(a==='overview'){detail=false;managing=false}else if(a==='manage'){managing=!managing;selected.clear()}else if(a.startsWith('filter:')){filter=v;selected.clear()}else if(a.startsWith('type:'))type=v;else if(a.startsWith('master:'))mastered.has(+v)?mastered.delete(+v):mastered.add(+v);else if(a==='batchmaster'){selected.forEach(i=>mastered.add(i));selected.clear()}else if(a==='reviewstart'||a.startsWith('reviewq:')){screen='practice';reviewMode=true;index=a.startsWith('reviewq:')?+v:0;answers={};submitted.clear()}else if(a==='masterq'){mastered.add(index);show('已标记掌握','<p>可以在错题管理中移回待复习。</p>');return}render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id==='wrongsearch'){const word=e.target.value;document.querySelectorAll('#wrong-list .question-row').forEach(r=>r.hidden=!r.textContent.includes(word))}});
document.addEventListener('change',e=>{if(e.target.dataset.select!==undefined){let id=+e.target.dataset.select;e.target.checked?selected.add(id):selected.delete(id);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.innerHTML=''});
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'浅色模式':'深色模式'};
document.getElementById('font').onclick=()=>{document.body.classList.toggle('large-font');document.getElementById('font').textContent=document.body.classList.contains('large-font')?'标准字体':'大字体'};
render();
})();
</script>
</html>
